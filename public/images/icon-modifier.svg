<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#8B7AAE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Scale beam -->
  <line x1="12" y1="18" x2="36" y2="18" stroke="#8B7AAE" stroke-width="2.5"/>
  <!-- Center pole -->
  <line x1="24" y1="10" x2="24" y2="38" stroke="#8B7AAE" stroke-width="2.5"/>
  <!-- Center pivot circle -->
  <circle cx="24" cy="15" r="3" fill="rgba(139,122,174,0.3)" stroke="#8B7AAE"/>
  <!-- Base -->
  <path d="M18 38 L30 38" stroke="#8B7AAE" stroke-width="2.5"/>
  <path d="M21 38 L24 34 L27 38" fill="rgba(139,122,174,0.2)"/>
  <!-- Left pan strings -->
  <line x1="12" y1="18" x2="9" y2="26" stroke="#8B7AAE"/>
  <line x1="12" y1="18" x2="15" y2="26" stroke="#8B7AAE"/>
  <!-- Right pan strings -->
  <line x1="36" y1="18" x2="33" y2="26" stroke="#8B7AAE"/>
  <line x1="36" y1="18" x2="39" y2="26" stroke="#8B7AAE"/>
  <!-- Left pan (tilted lower = heavier) -->
  <path d="M7 28 Q12 31 17 28" fill="rgba(139,122,174,0.2)" stroke="#8B7AAE"/>
  <!-- Right pan (tilted higher = lighter) -->
  <path d="M31 24 Q36 27 41 24" fill="rgba(139,122,174,0.1)" stroke="#8B7AAE"/>
  <!-- Question marks on pans -->
  <text x="10" y="30" font-size="6" fill="#8B7AAE" stroke="none" font-family="serif">?</text>
  <text x="34" y="27" font-size="6" fill="#8B7AAE" stroke="none" font-family="serif">?</text>
</svg>
